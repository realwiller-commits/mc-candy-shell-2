name: Build mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Allow gradlew to run
        run: chmod +x gradlew

      - name: Build the mod
        run: ./gradlew build

      - name: Save the finished mod file
        uses: actions/upload-artifact@v4
        with:
          name: candyshell-mod
          path: build/libs/*.jar

